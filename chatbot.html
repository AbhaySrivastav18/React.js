<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput(){
        return (
          <>
            <input placeholder = "Send a meassage to Chatbot" size = "30"/>
            <button>Send</button>
          </>
        );
      }
      // function ChatMessage(props)
      function ChatMessage({message,sender}){    // This is basically destructuring in javascript. //it is same as like this const{message,sender} = props;
        // const {message,sender} = props;
        /*if(sender === 'robot'){
          return (
            <div>
              <img src="robot.png" width="50"/>
              {message}
            </div>
          )
        }*/
        return (
          <div>
            {sender === 'robot' && (
              <img src="robot.png" width="50"/>
            )}
            {message}
            {sender === 'user' && (
              <img src="user.png" width="50"/>
            )}
          </div>
        )
      }
      function ChatMessages(){
        const [chatMessages,setChatMessages] = React.useState([{
          message: 'hello chatbot',
          sender: 'user',
          id:'id1'
        },{
          message:'Hello! How can I help you?', 
          sender:'robot',
          id:'id2'
        },{
          message:'can you get me todays date?', 
          sender:'user',
          id:'id3'
        },{
          message:'Today is Feburary 14',
          sender:'robot',
          id:'id4'
        }]);
        // const [chatMessages,setChatMessages] = array;

        // const chatMessages=array[0];
        // const setChatMessages = array[1];

        function sendMessage(){
          // chatMessages.push({
          //   message:'test',
          //   sender:'user',                  //React does not allow to update the data directly.If we update the data directly react will not change the data.
          //   id: crypto.randomUUID()         //If we update the data by using this "setChatMessages = array[1];" then react will update the data.

          // });

          setChatMessages([
            ...chatMessages,
            {
              message:'test',
              sender:'user',
              id: crypto.randomUUID()
            }
          ]);                   // In React, we should not modify the data directly. We should create a copy,and then modify the copy.(This helps React be more efficient).
        }
        return (
          <>
            <button onClick={sendMessage}>Send Message</button>
            {chatMessages.map((chatMessage)=>{
              return(
                <ChatMessage
                    message={chatMessage.message}
                    sender={chatMessage.sender}
                    key={chatMessage.id}             //Use to keep track changes in the array and this have to be unique.
                />
              );
            })}
            </>
        );
      }
      function App(){
        
        return (
          <>
            <ChatInput/>
            <ChatMessages/>
          </>
        )
      }
      // const app = (
      //   <>
      //     <ChatInput/>
      //     <ChatMessage 
      //       message="hello chatbot" 
      //       sender="user"
      //     />
      //     <ChatMessage 
      //       message="Hello! How can I help you?" 
      //       sender="robot"
      //     />
      //     <ChatMessage 
      //       message="can you get me todays date?" 
      //       sender="user"
      //     />
      //     <ChatMessage 
      //       message = "Today is Feburary 14" 
      //       sender="robot"
      //     />

      //   </>
      // );
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);  
    </script>
  </body>
</html>

<!-- 
Components:- Piece of Website

Guard Operator(&&)
  const result = value1 && value2;
  if value1 is true,the result will be value2;
  This works just like an if-statement

State:-State is the data that is connected to the HTML
       When we update this data, it will update the HTML
-->
